x-compression-base: &compression-base
  build: ./compression
  restart: unless-stopped
  gpus: all
  networks:
    - miner-local
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
    - SHARED_VOLUME_PATH=/tmp/organic-proxy
    - DISABLE_REMOTE_IO=true
    - MAX_CONCURRENT_COMPRESSION=${MAX_CONCURRENT_COMPRESSION:-3}
    - MAX_QUEUE_SIZE_COMPRESSION=${MAX_QUEUE_SIZE_COMPRESSION:-5}
    - COMPRESSION_CHUNKING_ENABLED=${COMPRESSION_CHUNKING_ENABLED:-false}
    - COMPRESSION_CHUNK_MIN_DURATION_SECONDS=${COMPRESSION_CHUNK_MIN_DURATION_SECONDS:-1200}
    - COMPRESSION_CHUNK_TARGET_SECONDS=${COMPRESSION_CHUNK_TARGET_SECONDS:-600}
    - COMPRESSION_CHUNK_PARALLELISM=${COMPRESSION_CHUNK_PARALLELISM:-2}
    - FAST_RD_MODE=${FAST_RD_MODE:-true}
    - ADAPTIVE_FULL_SEARCH=${ADAPTIVE_FULL_SEARCH:-false}
    - FAST_ENCODE_TIMEOUT_SECONDS=${FAST_ENCODE_TIMEOUT_SECONDS:-55}
    - FAST_SVT_PRESET=${FAST_SVT_PRESET:-9}
    - FAST_X265_PRESET=${FAST_X265_PRESET:-ultrafast}
    - SN85_INTERNAL_DEADLINE_SECONDS=${SN85_INTERNAL_DEADLINE_SECONDS:-165}
    - ADAPTIVE_COMPRESSION=${ADAPTIVE_COMPRESSION:-false}
    - ADAPTIVE_VMAF_MARGIN=${ADAPTIVE_VMAF_MARGIN:-0.8}
    - ADAPTIVE_SAMPLE_SECONDS=${ADAPTIVE_SAMPLE_SECONDS:-3.0}
    - ADAPTIVE_MAX_CANDIDATES=${ADAPTIVE_MAX_CANDIDATES:-4}
    - ADAPTIVE_SVT_PRESET=${ADAPTIVE_SVT_PRESET:-9}
    - ADAPTIVE_X265_PRESET=${ADAPTIVE_X265_PRESET:-ultrafast}
    - ADAPTIVE_SVT_PROBE_PRESET=${ADAPTIVE_SVT_PROBE_PRESET:-9}
    - ADAPTIVE_X265_PROBE_PRESET=${ADAPTIVE_X265_PROBE_PRESET:-ultrafast}
    - ADAPTIVE_SVT_PARAMS=${ADAPTIVE_SVT_PARAMS:-tune=0}
    - ADAPTIVE_X265_PARAMS=${ADAPTIVE_X265_PARAMS:-aq-mode=3:rc-lookahead=5:frame-threads=4}
    - SN85_FORCE_ONE_PASS_VBR=${SN85_FORCE_ONE_PASS_VBR:-true}
    - VBR_TARGET_FRAC=${VBR_TARGET_FRAC:-0.92}
    - SVT_LP=${SVT_LP:-}
    - X265_POOLS=${X265_POOLS:-}
    - ADAPTIVE_VMAF_MODEL=${ADAPTIVE_VMAF_MODEL:-version=vmaf_v0.6.1neg}
    - ADAPTIVE_GATE_MODE=${ADAPTIVE_GATE_MODE:-mean}
    - ADAPTIVE_PUSH_STEPS=${ADAPTIVE_PUSH_STEPS:-0}
    - ADAPTIVE_SCORE_EPS=${ADAPTIVE_SCORE_EPS:-0.01}
    - ADAPTIVE_SEARCH_BUDGET_FRAC=${ADAPTIVE_SEARCH_BUDGET_FRAC:-0.05}
    - ADAPTIVE_TARGET_SCORE=${ADAPTIVE_TARGET_SCORE:-0.76}
    - ADAPTIVE_TARGET_RATIO_LO=${ADAPTIVE_TARGET_RATIO_LO:-18.0}
    - ADAPTIVE_TARGET_RATIO_HI=${ADAPTIVE_TARGET_RATIO_HI:-22.0}
    - MINER_COMPRESSION_SERVICE_TIMEOUT_SECONDS=${MINER_COMPRESSION_SERVICE_TIMEOUT_SECONDS:-90}
    - FFMPEG_VMAF_BIN=${FFMPEG_VMAF_BIN:-/usr/local/bin/ffmpeg-vmaf}
    - MINER_CLEANUP_ENABLED=${MINER_CLEANUP_ENABLED:-true}
    - MINER_CLEANUP_INTERVAL_SECONDS=${MINER_CLEANUP_INTERVAL_SECONDS:-300}
    - MINER_CLEANUP_MAX_VOLUME_BYTES=${MINER_CLEANUP_MAX_VOLUME_BYTES:-9000000000}
    - MINER_CLEANUP_MIN_FILE_AGE_SECONDS=${MINER_CLEANUP_MIN_FILE_AGE_SECONDS:-60}
    - MINER_TEMP_FILE_TTL_SECONDS=${MINER_TEMP_FILE_TTL_SECONDS:-}
    - PRESIGNED_URL_CLEANUP_GRACE_SECONDS=${PRESIGNED_URL_CLEANUP_GRACE_SECONDS:-600}
    - MINER_STORAGE_CLEANUP_ENABLED=${MINER_STORAGE_CLEANUP_ENABLED:-true}
    - MINER_STORAGE_CLEANUP_PREFIXES=${MINER_STORAGE_CLEANUP_PREFIXES:-processing/,upscaling/}
    - MINER_STORAGE_OBJECT_TTL_SECONDS=${MINER_STORAGE_OBJECT_TTL_SECONDS:-}
    - MINER_STORAGE_PROVIDER=${MINER_STORAGE_PROVIDER:-s3}
    - MINER_STORAGE_S3_REGION=${MINER_STORAGE_S3_REGION:-us-east-1}
    - MINER_STORAGE_S3_BUCKET_NAME=${MINER_STORAGE_S3_BUCKET_NAME:-}
    - MINER_STORAGE_S3_ACCESS_KEY_ID=${MINER_STORAGE_S3_ACCESS_KEY_ID:-}
    - MINER_STORAGE_S3_SECRET_ACCESS_KEY=${MINER_STORAGE_S3_SECRET_ACCESS_KEY:-}
    - MINER_STORAGE_S3_ENDPOINT_URL=${MINER_STORAGE_S3_ENDPOINT_URL:-${MINER_STORAGE_S3_ENDPOINT:-}}
    - MINER_STORAGE_S3_PRESIGNED_EXPIRY=${MINER_STORAGE_S3_PRESIGNED_EXPIRY:-${S3_PRESIGNED_EXPIRY:-3600}}
  volumes:
    - ${MINER_SHARED_DIR:-/tmp/vidaio-miner-video-tmp}:/tmp/organic-proxy
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8004/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s

services:
  upscaling-video2x:
    <<: *upscaling-video2x-base
    ports:
      - "127.0.0.1:8003:8003"

  upscaling-ffmpeg:
    <<: *upscaling-ffmpeg-base
    ports:
      - "127.0.0.1:8005:8003"

  compression:
    <<: *compression-base
    ports:
      - "127.0.0.1:8004:8004"

networks:
  miner-local:
    driver: bridge
